version: 1
name: Workday
slug: workday
summary: >-
  Read-only Workday access for Claude — fetch your tasks, pay, benefits and
  compensation data through your signed-in session
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: WORKDAY_TENANT
    required: true
    help: >-
      Workday tenant slug, e.g. `acme` for https://wd5.myworkday.com/acme.
  - name: WORKDAY_HOST
    required: false
    help: >-
      Workday data-center host (default wd5.myworkday.com).
  - name: WORKDAY_WS_PORT
    required: false
    help: >-
      Override the fetchproxy WebSocket port (default 37149).
  - name: WORKDAY_DEBUG
    required: false
    help: >-
      Set to 1 to log verbose request detail to stderr.
state:
  dataDir: true
  reason: >-
    The fetchproxy identity lives at $HOME/.fetchproxy/identity/<name>.json
    and the pair code derives from it. Without a persistent $HOME every cold
    start mints a fresh identity and re-prompts pairing in the browser; the
    API refuses bridge without it.
egress:
  # Only hosts the SERVER process actually fetches. Hosts that appear
  # solely in a URL this server BUILDS and returns are excluded.
  #
  # Empty on purpose: this is a pure browser-bridge MCP. Every Workday
  # request (the tenant's *.htmld pages and JSON under
  # https://<WORKDAY_HOST>/<WORKDAY_TENANT>/…, default wd5.myworkday.com)
  # is made by the user's signed-in tab via the fetchproxy extension, never
  # by this process (src/transport-fetchproxy.ts is the only transport;
  # there is no direct mode and no bootstrap that dials). WORKDAY_HOST only
  # selects WHICH signed-in tab the extension routes to — it is not a host
  # this process connects to, so it does not belong here on any tier. The
  # only socket the process opens is the loopback concentrator the
  # extension connects TO. Under the per-child fence the child cannot
  # resolve DNS at all, which is fine — it never needs to. The
  # SSO/sign-in redirect hosts (Ping/Okta/Entra) are likewise followed by
  # the browser, not by this process.
  allow: []
